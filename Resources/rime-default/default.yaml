# Noema built-in Rime defaults: the minimal pinyin schema shipped inside NoemaIME.app.
# Original, hand-written configuration; no third-party data. Encoding: UTF-8.
config_version: "1"

schema_list:
  - schema: noema_pinyin

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

key_binder:
  bindings:
    # - and = page the candidate menu, as do Page_Up / Page_Down (handled by selector).
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"

punctuator:
  full_shape:
    " ": { commit: "　" }
    ",": { commit: "，" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    ":": { commit: "：" }
    ";": { commit: "；" }
    "\\": { commit: "、" }
  half_shape:
    ",": { commit: "，" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    ":": { commit: "：" }
    ";": { commit: "；" }
    "\\": { commit: "、" }
    "/": { commit: "/" }
    "(": { commit: "（" }
    ")": { commit: "）" }
    "<": { commit: "《" }
    ">": { commit: "》" }
    "[": { commit: "「" }
    "]": { commit: "」" }
    "{": { commit: "『" }
    "}": { commit: "』" }
    "^": { commit: "……" }
    "_": { commit: "——" }
    "~": { commit: "～" }
    "$": { commit: "￥" }
    "'": { pair: ["‘", "’"] }
    "\"": { pair: ["“", "”"] }
    "-": "-"
    "=": "="
    "+": "+"
    "*": "*"
    "%": "%"
    "#": "#"
    "@": "@"
    "&": "&"
    "|": "|"
    "`": "`"
