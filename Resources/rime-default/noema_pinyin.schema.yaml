# Noema built-in minimal pinyin schema (full pinyin, sentence input).
# Original, hand-written configuration; no third-party data. Encoding: UTF-8.
schema:
  schema_id: noema_pinyin
  name: Noema 拼音
  version: "1"
  author:
    - Noema
  description: |
    Noema 内置最小全拼方案：仅用于 NoemaIME 首次启动与 Safe Mode 之外的基础输入。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/^([nl])ve$/$1ue/

translator:
  dictionary: noema_pinyin
  spelling_hints: 0
  preedit_format:
    - xform/([nl])v/$1ü/

key_binder:
  import_preset: default

punctuator:
  import_preset: default

recognizer:
  import_preset: default
